    Object:
      type: object
      properties:
        Key:
          type: string
          description: The name that you assign to an object. You use the object key to
            retrieve the object.
        LastModified:
          type: string
          description: Creation date of the object.
        ETag:
          type: string
          description: >-
            The entity tag is a hash of the object. The ETag reflects changes
            only to the contents of an object, not its metadata. The ETag may or
            may not be an MD5 digest of the object data. Whether or not it is
            depends on how the object was created and how it is encrypted as
            described below:


            *   Objects created by the PUT Object, POST Object, or Copy
            operation, or through the Amazon Web Services Management Console,
            and are encrypted by SSE-S3 or plaintext, have ETags that are an MD5
            digest of their object data.

            *   Objects created by the PUT Object, POST Object, or Copy
            operation, or through the Amazon Web Services Management Console,
            and are encrypted by SSE-C or SSE-KMS, have ETags that are not an
            MD5 digest of their object data.

            *   If an object is created by either the Multipart Upload or Part
            Copy operation, the ETag is not an MD5 digest, regardless of the
            method of encryption. If an object is larger than 16 MB, the Amazon
            Web Services Management Console will upload or copy that object as a
            Multipart Upload, and therefore the ETag will not be an MD5 digest.


            > **Note:**

            > **Directory buckets** - MD5 is not supported by directory buckets.
        ChecksumAlgorithm:
          type: array
          items:
            type: string
          description: The algorithm that was used to create a checksum of the object.
          xml:
            name: ChecksumAlgorithm
            wrapped: false
        ChecksumType:
          type: string
          description: The checksum type that is used to calculate the object’s checksum
            value. For more information, see [Checking object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        Size:
          type: integer
          description: Size in bytes of the object
        StorageClass:
          type: string
          description: >-
            The class of storage used to store the object.


            > **Note:**

            > **Directory buckets** - Directory buckets only support
            `EXPRESS_ONEZONE` (the S3 Express One Zone storage class) in
            Availability Zones and `ONEZONE_IA` (the S3 One Zone-Infrequent
            Access storage class) in Dedicated Local Zones.
        Owner:
          $ref: "#/components/schemas/Owner"
          description: >-
            The owner of the object


            > **Note:**

            > **Directory buckets** - The bucket owner is returned as the object
            owner.
        RestoreStatus:
          $ref: "#/components/schemas/RestoreStatus"
          description: |-
            Specifies the restoration status of an object. Objects in certain storage classes must be restored before they can be retrieved. For more information about these storage classes and how to work with archived objects, see [Working with archived objects](https://docs.aws.amazon.com/AmazonS3/latest/userguide/archived-objects.html) in the *Amazon S3 User Guide*.

            > **Note:**
            > This functionality is not supported for directory buckets. Directory buckets only support `EXPRESS_ONEZONE` (the S3 Express One Zone storage class) in Availability Zones and `ONEZONE_IA` (the S3 One Zone-Infrequent Access storage class) in Dedicated Local Zones.
      description: An object consists of data and its descriptive metadata.
      xml:
        name: Object
        namespace: http://s3.amazonaws.com/doc/2006-03-01/
    Owner:
      type: object
      properties:
        DisplayName:
          type: string
        ID:
          type: string
          description: Container for the ID of the owner.
      description: Container for the owner's display name and ID.
      xml:
        name: Owner
        namespace: http://s3.amazonaws.com/doc/2006-03-01/
    RestoreStatus:
      type: object
      properties:
        IsRestoreInProgress:
          type: boolean
          description: >-
            Specifies whether the object is currently being restored. If the
            object restoration is in progress, the header returns the value
            `TRUE`. For example:


            `x-amz-optional-object-attributes: IsRestoreInProgress="true"`


            If the object restoration has completed, the header returns the
            value `FALSE`. For example:


            `x-amz-optional-object-attributes: IsRestoreInProgress="false",
            RestoreExpiryDate="2012-12-21T00:00:00.000Z"`


            If the object hasn't been restored, there is no header response.
        RestoreExpiryDate:
          type: string
          description: >-
            Indicates when the restored copy will expire. This value is
            populated only if the object has already been restored. For example:


            `x-amz-optional-object-attributes: IsRestoreInProgress="false",
            RestoreExpiryDate="2012-12-21T00:00:00.000Z"`
      description: |-
        Specifies the restoration status of an object. Objects in certain storage classes must be restored before they can be retrieved. For more information about these storage classes and how to work with archived objects, see [Working with archived objects](https://docs.aws.amazon.com/AmazonS3/latest/userguide/archived-objects.html) in the *Amazon S3 User Guide*.

        > **Note:**
        > This functionality is not supported for directory buckets. Directory buckets only support `EXPRESS_ONEZONE` (the S3 Express One Zone storage class) in Availability Zones and `ONEZONE_IA` (the S3 One Zone-Infrequent Access storage class) in Dedicated Local Zones.
      xml:
        name: RestoreStatus
        namespace: http://s3.amazonaws.com/doc/2006-03-01/
    CommonPrefix:
      type: object
      properties:
        Prefix:
          type: string
          description: Container for the specified common prefix.
      description: Container for all (if there are any) keys between Prefix and the
        next occurrence of the string specified by a delimiter. CommonPrefixes
        lists keys that act like subdirectories in the directory specified by
        Prefix. For example, if the prefix is notes/ and the delimiter is a
        slash (/) as in notes/summer/july, the common prefix is notes/summer/.
      xml:
        name: CommonPrefix
        namespace: http://s3.amazonaws.com/doc/2006-03-01/

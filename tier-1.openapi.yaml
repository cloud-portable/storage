            source object (e.g., `AES256`). Required if the source object was
            encrypted with SSE-C.
          schema:
            type: string
        - name: x-amz-copy-source-server-side-encryption-customer-key
          in: header
          required: false
          description: Specifies the customer-provided encryption key used to encrypt the
            source object. Required if the source object was encrypted with
            SSE-C.
          schema:
            type: string
        - name: x-amz-copy-source-server-side-encryption-customer-key-MD5
          in: header
          required: false
          description: Provides the MD5 digest of the customer-provided encryption key
            used to encrypt the source object for integrity validation.
          schema:
            type: string
        - name: x-amz-source-expected-bucket-owner
          in: header
          required: false
          description: The account identifier of the expected source bucket owner. If the
            actual owner does not match, the request fails with an HTTP `403
            Forbidden` error.
          schema:
            type: string
        - name: partNumber
          in: query
          required: true
          description: The part number identifying the position of the part. This must be
            an integer between 1 and 10,000, inclusive.
          schema:
            type: integer
        - name: uploadId
          in: query
          required: true
          description: The upload identifier that uniquely identifies the multipart upload.
          schema:
            type: string
        - name: x-amz-copy-source-range
          in: header
          required: false
          description: Specifies the byte range to copy from the source object, formatted
            as `bytes=first-last` (zero-based).
          schema:
            type: string
      requestBody:
        description: >-
          Request payload format varies depending on the operation:

          - **PutObject**: The object payload data to be stored.

          - **CopyObject**: Empty request body (copy source is specified in
          header)

          - **UploadPart**: The payload data of the part being uploaded.

          - **UploadPartCopy**: Request payload for UploadPartCopy
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: object
              description: Request payload for UploadPartCopy
      responses:
        "200":
          description: Successful response
          headers:
            x-amz-expiration:
              description: If the destination object's expiration is configured by a lifecycle
                rule, this header indicates when the object copy becomes
                eligible for deletion.
              schema:
                type: string
            ETag:
              description: The entity tag (ETag) representing the uploaded part, typically
                formatted as the double-quoted MD5 hash of the part payload.
              schema:
                type: string
            x-amz-checksum-crc32:
              description: The Base64 encoded 32-bit CRC32 checksum of the part.
              schema:
                type: string
            x-amz-checksum-crc32c:
              description: The Base64 encoded 32-bit CRC32C checksum of the part.
              schema:
                type: string
            x-amz-checksum-crc64nvme:
              description: The Base64 encoded 64-bit CRC64NVME checksum of the part.
              schema:
                type: string
            x-amz-checksum-sha1:
              description: The Base64 encoded 160-bit SHA1 digest of the part.
              schema:
                type: string
            x-amz-checksum-sha256:
              description: The Base64 encoded 256-bit SHA256 digest of the part.
              schema:
                type: string
            x-amz-checksum-sha512:
              description: The Base64 encoded 512-bit SHA512 digest of the part.
              schema:
                type: string
            x-amz-checksum-md5:
              description: The Base64 encoded 128-bit MD5 checksum of the part.
              schema:
                type: string
            x-amz-checksum-xxhash64:
              description: The Base64 encoded 64-bit XXHASH64 checksum of the part.
              schema:
                type: string
            x-amz-checksum-xxhash3:
              description: The Base64 encoded 64-bit XXHASH3 checksum of the part.
              schema:
                type: string
            x-amz-checksum-xxhash128:
              description: The Base64 encoded 128-bit XXHASH128 checksum of the part.
              schema:
                type: string
            x-amz-checksum-type:
              description: Specifies the checksum type of the object, which determines how
                part-level checksums are combined.
              schema:
                type: string
            x-amz-server-side-encryption:
              description: The server-side encryption algorithm used to protect the
                destination part (e.g., `AES256` or `aws:kms`).
              schema:
                type: string
            x-amz-version-id:
              description: Indicates the version ID of the newly created object copy in the
                destination bucket.
              schema:
                type: string
            x-amz-server-side-encryption-customer-algorithm:
              description: Confirms the server-side encryption algorithm used when
                customer-provided encryption keys (SSE-C) were requested for the
                destination part.
              schema:
                type: string
            x-amz-server-side-encryption-customer-key-MD5:
              description: Provides the MD5 digest of the customer-provided encryption key for
                integrity validation when SSE-C was used for the destination

            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumCRC32C:
          type: string
          description: The Base64 encoded, 32-bit `CRC32C` checksum of the object. This
            checksum is only present if the checksum was uploaded with the
            object. For more information, see [Checking object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumCRC64NVME:
          type: string
          description: The Base64 encoded, 64-bit `CRC64NVME` checksum of the object. This
            checksum is present if the object being copied was uploaded with the
            `CRC64NVME` checksum algorithm, or if the object was uploaded
            without a checksum (and Amazon S3 added the default checksum,
            `CRC64NVME`, to the uploaded object). For more information, see
            [Checking object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumSHA1:
          type: string
          description: The Base64 encoded, 160-bit `SHA1` digest of the object. This
            checksum is only present if the checksum was uploaded with the
            object. For more information, see [Checking object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumSHA256:
          type: string
          description: The Base64 encoded, 256-bit `SHA256` digest of the object. This
            checksum is only present if the checksum was uploaded with the
            object. For more information, see [Checking object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumSHA512:
          type: string
          description: The Base64 encoded, 512-bit `SHA512` digest of the object. This
            checksum is only present if the object was uploaded with the
            `SHA512` checksum algorithm. For more information, see [Checking
            object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumMD5:
          type: string
          description: The Base64 encoded, 128-bit `MD5` digest of the object. This
            checksum is only present if the object was uploaded with the `MD5`
            checksum algorithm. For more information, see [Checking object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumXXHASH64:
          type: string
          description: The Base64 encoded, 64-bit `XXHASH64` checksum of the object. This
            checksum is only present if the object was uploaded with the
            `XXHASH64` checksum algorithm. For more information, see [Checking
            object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumXXHASH3:
          type: string
          description: The Base64 encoded, 64-bit `XXHASH3` checksum of the object. This
            checksum is only present if the object was uploaded with the
            `XXHASH3` checksum algorithm. For more information, see [Checking
            object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
        ChecksumXXHASH128:
          type: string
          description: The Base64 encoded, 128-bit `XXHASH128` checksum of the object.
            This checksum is only present if the object was uploaded with the
            `XXHASH128` checksum algorithm. For more information, see [Checking
            object
            integrity](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html)
            in the *Amazon S3 User Guide*.
      description: Container for all response elements.

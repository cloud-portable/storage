                $ref: "#/components/schemas/CopyObjectResult"
        "400":
          description: Successful response
          headers: {}
        "403":
          description: Successful response
          headers: {}
        "404":
          description: Successful response
          headers: {}
    get:
      operationId: GetObjectOrListParts
      summary: GetObjectOrListParts
      description: >-
        This endpoint combines multiple S3 behaviors depending on the request
        parameters and headers:


        ### GetObject


        Retrieves an object from the storage system.


        In the request, specify the bucket name and the key of the object to
        retrieve.


        **Permissions:** The client credentials must be authorized to perform
        this operation. Under the standard S3 IAM policy model, this requires
        the `s3:GetObject` permission on the object. If retrieving a specific
        version of the object, the client requires `s3:GetObjectVersion`
        permission.


        **Overriding Response Headers:** Clients can dynamically override
        certain metadata headers in the response (such as `Content-Type`,
        `Cache-Control`, or `Content-Disposition`) by specifying the
        corresponding `response-*` query parameters. These overrides are only
        returned on successful `200 OK` responses and are useful for customizing
        client download behaviors.


        **Range Retrieval:** The operation supports retrieving specific byte
        ranges of an object using the standard `Range` HTTP header, or specific
        part indices using the `partNumber` query parameter.


        **Data Integrity:** Checksums can be retrieved and validated by
        specifying the `x-amz-checksum-mode` header.


        ---


        ### ListParts


        Lists the parts that have been uploaded for a specific multipart upload.


        **Multipart Workflow:** To list the parts, the requester must specify
        the upload identifier (`uploadId`) obtained during the initialization of
        the multipart upload (via `CreateMultipartUpload`). The returned parts
        are sorted by part number.


        **Pagination:** By default, this operation returns up to 1,000 parts. If
        there are more parts available, the response includes an `IsTruncated`
        field set to `true` and a `NextPartNumberMarker`. To retrieve the
        subsequent parts, make a follow-up request with the `part-number-marker`
        parameter set to the value of `NextPartNumberMarker`. Requesters can
        also restrict the page size using the `max-parts` query parameter.


        **Permissions:** The client credentials must be authorized to perform
        this operation on the target bucket. Under the standard S3 IAM policy
        model, this requires the `s3:ListMultipartUploadParts` action.
      parameters:
        - name: Bucket
          in: path
          required: true
          description: The name of the bucket containing the object.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: Return the object only if its entity tag (ETag) matches the
            specified value; otherwise, return a `412 Precondition Failed`
            error.
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          description: Return the object only if it has been modified since the specified
            time; otherwise, return a `304 Not Modified` status code.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: Return the object only if its entity tag (ETag) is different from
            the specified value; otherwise, return a `304 Not Modified` status
            code.
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          description: Return the object only if it hasn't been modified since the
            specified time; otherwise, return a `412 Precondition Failed` error.
          schema:
            type: string
        - name: Key
          in: path
          required: true
          description: The key of the object to retrieve.
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: Downloads the specified byte range of an object. The range format
            must comply with standard HTTP specifications (e.g.,
            `bytes=0-1048575`). Note that most S3-compatible storage engines do
            not support retrieving multiple ranges in a single request.
          schema:
            type: string
        - name: response-cache-control
          in: query
          required: false
          description: Sets the `Cache-Control` header of the response.
          schema:
            type: string
        - name: response-content-disposition
          in: query
          required: false
          description: Sets the `Content-Disposition` header of the response.
          schema:
            type: string
        - name: response-content-encoding
          in: query
          required: false
          description: Sets the `Content-Encoding` header of the response.
          schema:
            type: string
        - name: response-content-language
          in: query
          required: false
          description: Sets the `Content-Language` header of the response.
          schema:
            type: string
        - name: response-content-type
          in: query
          required: false
          description: Sets the `Content-Type` header of the response.
          schema:
            type: string
        - name: response-expires
          in: query
          required: false
          description: Sets the `Expires` header of the response.
          schema:
            type: string
        - name: versionId
          in: query
          required: false
          description: Retrieves a specific version of the object instead of the latest
            version. If the specified version is a delete marker, the response
            returns a `405 Method Not Allowed` error.
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-algorithm
          in: header
          required: false
          description: Specifies the encryption algorithm used to decrypt the object
            (e.g., `AES256`). Required if the object was encrypted with
            customer-provided keys (SSE-C).
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-key
          in: header
          required: false
          description: Specifies the customer-provided encryption key used to decrypt the
            object. Required if the object was encrypted with customer-provided
            keys (SSE-C).
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-key-MD5
          in: header
          required: false
          description: Provides the MD5 digest of the customer-provided encryption key for
            integrity validation. Required if the object was encrypted with
            customer-provided keys (SSE-C).
          schema:
            type: string
        - name: x-amz-request-payer
          in: header
          required: false
          description: Confirms that the requester understands they will be charged for
            processing the request. This header is required when accessing
            buckets configured with requester-pays billing enabled.
          schema:
            type: string
        - name: partNumber
          in: query
          required: false
          description: Retrieves a specific part of a multipart object. This is a positive
            integer between 1 and 10,000. Effectively performs a ranged GET
            request for the specified part.
          schema:
            type: integer
        - name: x-amz-expected-bucket-owner
          in: header
          required: false
          description: The account identifier of the expected bucket owner. If the actual
            owner does not match, the request fails with an HTTP `403 Forbidden`
            error.
          schema:
            type: string
        - name: x-amz-checksum-mode
          in: header
          required: false
          description: Enables retrieving the object checksums in the response by setting
            this header to `ENABLED`. When enabled, the response will include
            the corresponding checksum headers if they were calculated during
            upload.
          schema:
            type: string
        - name: max-parts
          in: query
          required: false
          description: Sets the maximum number of parts to return in the response.
          schema:
            type: integer
        - name: part-number-marker
          in: query
          required: false
          description: Specifies the part number after which the listing should begin.
            Only parts with higher part numbers will be returned.
          schema:
            type: string
        - name: uploadId
          in: query
          required: true
          description: The upload identifier that uniquely identifies the multipart upload.
          schema:
            type: string
      responses:
        "200":
          description: Object data.
          headers:
            x-amz-delete-marker:
              description: Indicates whether the retrieved object is a delete marker. If set
                to `true`, the object has been soft-deleted.
              schema:
                type: string
            accept-ranges:
              description: Indicates whether the server supports range requests for objects.
                Usually returns `bytes`.
              schema:
                type: string
            x-amz-expiration:
              description: If the object is subject to an expiration lifecycle rule, this
                header indicates when the object becomes eligible for deletion.
              schema:
                type: string
            x-amz-restore:
              description: If the object was restored from an archive storage class, this
                header provides information about the restoration status and
                when the restored copy expires.
              schema:
                type: string
            Last-Modified:
              description: The date and time when the object was last modified.
              schema:
                type: string
            Content-Length:
              description: The size of the returned object body in bytes. If a range is
                requested, this represents the size of the range.
              schema:
                type: string
            ETag:
              description: The entity tag (ETag) representing the stored object. For
                single-part uploads, the ETag is the double-quoted MD5 hash of
                the object payload. For multipart uploads, it is typically the
                MD5 hash of the concatenated MD5 digests of each uploaded part,
                followed by a hyphen and the total part count (e.g.,
                `"<hash>-N"`). If the object is encrypted on the server-side,
                the ETag may not represent the MD5 hash of the payload.
              schema:
                type: string
            x-amz-checksum-crc32:
              description: The Base64 encoded 32-bit CRC32 checksum of the object.
              schema:
                type: string
            x-amz-checksum-crc32c:
              description: The Base64 encoded 32-bit CRC32C checksum of the object.
              schema:
                type: string
            x-amz-checksum-crc64nvme:
              description: The Base64 encoded 64-bit CRC64NVME checksum of the object.
              schema:
                type: string
            x-amz-checksum-sha1:
              description: The Base64 encoded 160-bit SHA1 digest of the object.
              schema:
                type: string
            x-amz-checksum-sha256:
              description: The Base64 encoded 256-bit SHA256 digest of the object.
              schema:
                type: string
            x-amz-checksum-sha512:
              description: The Base64 encoded 512-bit SHA512 digest of the object.
              schema:
                type: string
            x-amz-checksum-md5:
              description: The Base64 encoded 128-bit MD5 digest of the object.
              schema:
                type: string
            x-amz-checksum-xxhash64:
              description: The Base64 encoded 64-bit XXHASH64 checksum of the object.
              schema:
                type: string
            x-amz-checksum-xxhash3:
              description: The Base64 encoded 64-bit XXHASH3 checksum of the object.
              schema:
                type: string
            x-amz-checksum-xxhash128:
              description: The Base64 encoded 128-bit XXHASH128 checksum of the object.
              schema:
                type: string
            x-amz-checksum-type:
              description: Indicates how the object's checksum was calculated (e.g., combining
                part-level checksums for multipart uploads).
              schema:
                type: string
            x-amz-missing-meta:
              description: Indicates the number of custom metadata headers that were not
                returned due to formatting limitations.
              schema:
                type: string
            x-amz-version-id:
              description: The version identifier of the retrieved object.
              schema:
                type: string
            Cache-Control:
              description: Specifies caching behavior along the request/reply chain.
              schema:
                type: string
            Content-Disposition:
              description: Specifies presentational information for the object.
              schema:
                type: string
            Content-Encoding:
              description: Specifies content encodings applied to the object, indicating what
                decoding mechanisms must be applied to obtain the media-type
                referenced by the Content-Type header.
              schema:
                type: string
            Content-Language:
              description: The language the content is in.
              schema:
                type: string
            Content-Range:
              description: Indicates the range of bytes returned by this response (e.g.,
                `bytes 0-1048575/5242880` where the last number is the total
                object size).
              schema:
                type: string
            Content-Type:
              description: A standard MIME type describing the format of the object data.
              schema:
                type: string
            Expires:
              description: The date and time at which the object is no longer cacheable.
              schema:
                type: string
            x-amz-website-redirect-location:
              description: Specifies the redirect location for requests to this object when
                the bucket is configured as a static website.
              schema:
                type: string
            x-amz-server-side-encryption:
              description: Specifies the server-side encryption algorithm used when storing
                the object.
              schema:
                type: string
            x-amz-server-side-encryption-customer-algorithm:
              description: Indicates the server-side encryption algorithm used if the object
                was encrypted with customer-provided keys.
              schema:
                type: string
            x-amz-server-side-encryption-customer-key-MD5:
              description: Provides the MD5 digest of the customer-provided encryption key if
                the object was encrypted with customer-provided keys.
              schema:
                type: string
            x-amz-server-side-encryption-aws-kms-key-id:
              description: Indicates the KMS key identifier used if the object was encrypted
                with SSE-KMS.
              schema:
                type: string
            x-amz-server-side-encryption-bucket-key-enabled:
              description: Indicates whether the object uses an S3 Bucket Key for server-side
                encryption with KMS keys (SSE-KMS).
              schema:
                type: string
            x-amz-storage-class:
              description: Provides storage class information of the object.
              schema:
                type: string
            x-amz-request-charged:
              description: Indicates if the request was charged under requester-pays billing
                rules.
              schema:
                type: string
            x-amz-replication-status:
              description: Indicates the status of replication for this object (e.g.,
                `PENDING`, `COMPLETED`, `FAILED`).
              schema:
                type: string
            x-amz-mp-parts-count:
              description: The count of parts this object has. Only returned if the object was
                uploaded as a multipart upload and a specific `partNumber` was
                requested.
              schema:
                type: string
            x-amz-tagging-count:
              description: The number of tags associated with this object.
              schema:
                type: string
            x-amz-object-lock-mode:
              description: Specifies the Object Lock retention mode (`RETENTION` or
                `COMPLIANCE`) currently in place for this object.
              schema:
                type: string
            x-amz-object-lock-retain-until-date:
              description: Specifies the timestamp when the Object Lock retention period is
                set to expire on this object.
              schema:
                type: string
            x-amz-object-lock-legal-hold:
              description: Specifies whether a legal hold is applied to this object (`ON` or
                `OFF`).
              schema:
                type: string
            x-amz-abort-date:
              description: If a lifecycle configuration rule matches the object and is set to
                abort incomplete multipart uploads, this header indicates when
                the initiated multipart upload becomes eligible for deletion.
              schema:
                type: string
            x-amz-abort-rule-id:
              description: Indicates the ID of the lifecycle rule that defines the abort
                action for incomplete multipart uploads.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Successful response
          headers: {}
        "403":
          description: Successful response
          headers: {}
        "404":
          description: Successful response
          headers: {}
    head:
      operationId: HeadObject
      summary: HeadObject
      description: >-
        Retrieves metadata from an object without returning the object payload
        itself.


        **Metadata Retrieval:** This operation is useful for retrieving object
        properties (such as size, ETag, content type, or custom metadata)
        without transferring the object content. The response is identical to a
        `GET` request for the same object, except the response body is omitted.
        If the object does not exist or access is denied, the storage engine
        returns standard HTTP status codes (such as `404 Not Found` or `403
        Forbidden`). Because this is a `HEAD` request, no response body is
        returned with error details.


        **Versioning and Delete Markers:** If the requested key points to a
        delete marker, the storage engine treats the object as deleted,
        returning an HTTP `404 Not Found` response with the
        `x-amz-delete-marker: true` header. If a specific version ID is
        requested and it points to a delete marker, the response returns HTTP
        `405 Method Not Allowed`.


        **Permissions:** Requesters must have permission to read the object.
        Under the standard S3 IAM policy model, this requires the `s3:GetObject`
        action. If the object does not exist, the error code returned depends on
        list permissions: an HTTP `404 Not Found` is returned if the requester
        has the `s3:ListBucket` action; otherwise, an HTTP `403 Forbidden` is
        returned.
      parameters:
        - name: Bucket
          in: path
          required: true
          description: The name of the bucket that contains the object.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: Returns object metadata only if its entity tag (ETag) matches the
            specified value. Otherwise, the operation returns an HTTP `412
            Precondition Failed` error.
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          description: Returns object metadata only if the object has been modified since
            the specified timestamp. Otherwise, the operation returns an HTTP
            `304 Not Modified` error.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: Returns object metadata only if its entity tag (ETag) is different
            from the specified value. Otherwise, the operation returns an HTTP
            `304 Not Modified` error.
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          description: Returns object metadata only if the object has not been modified
            since the specified timestamp. Otherwise, the operation returns an
            HTTP `412 Precondition Failed` error.
          schema:
            type: string
        - name: Key
          in: path
          required: true
          description: The object key.
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: Specifies the byte range to query. If satisfiable, only the
            `Content-Length` header in the response is affected.
          schema:
            type: string
        - name: response-cache-control
          in: query
          required: false
          description: Overrides the `Cache-Control` header in the response.
          schema:
            type: string
        - name: response-content-disposition
          in: query
          required: false
          description: Overrides the `Content-Disposition` header in the response.
          schema:
            type: string
        - name: response-content-encoding
          in: query
          required: false
          description: Overrides the `Content-Encoding` header in the response.
          schema:
            type: string
        - name: response-content-language
          in: query
          required: false
          description: Overrides the `Content-Language` header in the response.
          schema:
            type: string
        - name: response-content-type
          in: query
          required: false
          description: Overrides the `Content-Type` header in the response.
          schema:
            type: string
        - name: response-expires
          in: query
          required: false
          description: Overrides the `Expires` header in the response.
          schema:
            type: string
        - name: versionId
          in: query
          required: false
          description: Specifies the version identifier of the object to query. If not
            specified, the query applies to the current version.
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-algorithm
          in: header
          required: false
          description: Specifies the encryption algorithm used to encrypt the object with
            customer-provided keys (SSE-C).
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-key
          in: header
          required: false
          description: Specifies the 256-bit, base64-encoded customer encryption key if
            using SSE-C.
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-key-MD5
          in: header
          required: false
          description: Specifies the 128-bit, base64-encoded MD5 digest of the customer
            encryption key if using SSE-C.
          schema:
            type: string
        - name: x-amz-request-payer
          in: header
          required: false
          description: Confirms that the requester understands they will be charged for
            processing the request. This header is required when accessing
            buckets configured with requester-pays billing enabled.
          schema:
            type: string
        - name: partNumber
          in: query
          required: false

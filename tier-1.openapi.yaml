    put:
      operationId: PutObjectOrCopyObjectOrUploadPartOrUploadPartCopy
      summary: PutObjectOrCopyObjectOrUploadPartOrUploadPartCopy
      description: >-
        This endpoint combines multiple S3 behaviors depending on the request
        parameters and headers:


        ### PutObject


        Adds an object to a bucket. If an object with the same key already
        exists, the storage engine overwrites the existing object.


        **Concurrency:** Concurrent write requests to the same key are resolved
        using Last-Writer-Wins (LWW) semantics. The request that completes last
        will overwrite any other concurrent writes. From the client's
        perspective, the final ordering of overlapping requests is undefined.


        **Conditional Writes:** Clients can perform conditional uploads using
        headers like `If-None-Match` or `If-Match`. For example, setting
        `If-None-Match: *` ensures the upload succeeds only if the object key
        does not already exist, returning a `412 Precondition Failed` error on
        conflict.


        **Versioning:** If bucket versioning is enabled, overwriting an existing
        object creates a new object version rather than replacing the existing
        data. The previous version remains accessible, and the write operation
        returns a unique version identifier (`x-amz-version-id`).


        **Data Integrity:** To ensure data is not corrupted during transit,
        clients can specify the `Content-MD5` header or use SDK-managed checksum
        headers (e.g., `x-amz-sdk-checksum-algorithm` alongside
        `x-amz-checksum-sha256`). The storage engine validates the uploaded
        payload against the provided hash and rejects the request if they do not
        match.


        **Permissions:** The client credentials must be authorized to perform
        the operation on the target bucket. Under the standard S3 IAM policy
        model, this requires the `s3:PutObject` action. Additional permissions
        like `s3:PutObjectAcl` or `s3:PutObjectTagging` are required if the
        request specifies canned ACLs or tags, respectively.


        ---


        ### CopyObject


        Creates a copy of an object that is already stored in the storage
        system.


        Objects up to 5 GB in size can be copied in a single atomic operation.
        To copy objects larger than 5 GB, the multipart upload
        [UploadPartCopy](UploadPartCopy.md) API must be used instead.


        **Permissions:** The client credentials must be authorized to perform
        the operation on the target bucket. Under the standard S3 IAM policy
        model, this requires the `s3:GetObject` permission on the source object
        and the `s3:PutObject` permission on the destination bucket.


        **Concurrency:** Concurrent write requests to the same key are resolved
        using Last-Writer-Wins (LWW) semantics. The request that completes last
        will overwrite any other concurrent writes. From the client's
        perspective, the final ordering of overlapping requests is undefined.


        **Conditional Copying:** Clients can perform conditional copying using
        headers like `x-amz-copy-source-if-match`,
        `x-amz-copy-source-if-none-match`,
        `x-amz-copy-source-if-modified-since`, or
        `x-amz-copy-source-if-unmodified-since`. For example, setting
        `x-amz-copy-source-if-match` ensures the copy succeeds only if the
        source object's ETag matches the specified value.


        **Encryption:** When copying an object, the destination object can be
        encrypted using server-side encryption. The target encryption
        configuration is determined by the default configuration of the
        destination bucket, unless overridden by specifying encryption headers
        like `x-amz-server-side-encryption` or customer-managed keys.


        **Metadata and Tagging:** By default, object metadata and tags are
        copied from the source object. This behavior can be controlled using the
        `x-amz-metadata-directive` and `x-amz-tagging-directive` headers. If set
        to `REPLACE`, new metadata or tags can be supplied in the request.


        **Response and Error Handling:** For HTTP 1.1 requests, the response may
        be chunk-encoded. If an error occurs after the copy starts, the error
        response might be embedded within a `200 OK` status code. Clients must
        parse the entire XML response body to verify if the copy operation was
        completed successfully.


        ---


        ### UploadPart


        Uploads a part in a multipart upload.


        **Multipart Workflow:** To upload a part, the client must specify the
        bucket name, the object key, the upload identifier (`uploadId`), and a
        part number (ranging from 1 to 10,000, inclusive). The part number
        defines the part's position within the final object. Uploading a part
        with a part number that was previously used overwrites the existing part
        data.


        **Billing & Lifecycle:** Requesters accumulate storage costs for all
        uploaded parts until the multipart upload is either finalized via
        `CompleteMultipartUpload` or cancelled via `AbortMultipartUpload`. It is
        recommended to configure lifecycle rules to clean up incomplete
        multipart uploads automatically.


        **Permissions:** The client credentials must be authorized to perform
        this operation. Under the standard S3 IAM policy model, this requires
        the `s3:PutObject` action. If the upload is encrypted using server-side
        encryption with KMS keys, key permissions (e.g., `kms:Decrypt` and
        `kms:GenerateDataKey`) are also required.


        ---


        ### UploadPartCopy


        Uploads a part of an in-progress multipart upload by copying data from
        an existing object as the data source.


        **Multipart Workflow:** To upload a part via copy, the client must
        specify the target bucket name, the target object key, the upload
        identifier (`uploadId`), the part number (ranging from 1 to 10,000,
        inclusive), and the copy source object (`x-amz-copy-source`). Clients
        can optionally copy a specific byte range of the source object by
        providing the `x-amz-copy-source-range` header.


        **Source Object Access:** By default, this operation copies the current
        version of the source object. If versioning is enabled on the source
        bucket, a specific version can be copied by appending
        `?versionId=<version-id>` to the copy source path. If the source object
        is encrypted, appropriate decryption keys must be provided.


        **Permissions:** The client credentials must be authorized to perform
        this operation. This requires read permissions (`s3:GetObject` in the
        standard S3 IAM policy model) on the copy source object, and write
        permissions (`s3:PutObject` in the standard S3 IAM policy model) on the
        destination bucket. If the source or destination is encrypted with KMS
        keys, key permissions (e.g., `kms:Decrypt` and `kms:GenerateDataKey`)
        are also required.
      parameters:

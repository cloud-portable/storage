openapi: 3.1.0
info:
  title: Cloud Portable Storage API
  version: 1.0.0
  description: A minimal, portable, S3-compatible object storage baseline API (Tier 1 Core).
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
security:
  - SigV4: []
servers:
  - url: http://localhost:8080
    description: Local storage engine proxy
paths:
  /{Bucket}:
    post:
      operationId: DeleteObjects
      summary: DeleteObjects
      description: >-
        Deletes multiple objects from a bucket in a single HTTP request.


        **Batch Operations:** This operation allows clients to delete up to
        1,000 keys in a single transaction, significantly reducing request
        overhead compared to individual delete requests. The request body
        contains an XML list of the object keys to delete. For versioned
        buckets, specific version identifiers can also be specified to
        permanently delete those versions.


        **Response Modes:** The operation supports two modes for returning
        results:

        - **Verbose Mode (Default):** The response includes a detailed status
        (success or failure) for every key specified in the request.

        - **Quiet Mode:** The response only includes entries for keys that
        encountered an error during deletion. Successful deletions do not return
        any information.


        **Permissions:** Requesters must have permission to perform delete
        operations on the target bucket. Under the standard S3 IAM policy model,
        this requires the `s3:DeleteObject` action. Deleting specific object
        versions requires the `s3:DeleteObjectVersion` action. If any deletion
        attempt is denied by policy, the response will record a permission error
        for that key.
      parameters:
        - name: Bucket
          in: path
          required: true
          description: The name of the bucket containing the objects to delete.
          schema:
            type: string
        - name: x-amz-mfa
          in: header
          required: false
          description: "> **Avoid:** MFA delete configurations are legacy and unsupported
            by many engines."
          schema:
            type: string
        - name: x-amz-request-payer
          in: header
          required: false
          description: Confirms that the requester understands they will be charged for
            processing the request. This header is required when accessing
            buckets configured with requester-pays billing enabled.
          schema:
            type: string
        - name: x-amz-bypass-governance-retention
          in: header
          required: false
          description: Specifies whether to bypass Object Lock Governance-mode retention
            configurations to delete the object versions.
          schema:
            type: boolean
        - name: x-amz-expected-bucket-owner
          in: header
          required: false
          description: The account identifier of the expected bucket owner. If the actual
            owner does not match, the request fails with an HTTP `403 Forbidden`
            error.
          schema:
            type: string
        - name: x-amz-sdk-checksum-algorithm
          in: header
          required: false
          description: Indicates the algorithm to use to calculate the checksum for the
            request body (e.g., `CRC32`, `CRC32C`, `SHA1`, `SHA256`). Specifying
            this enables integrity validation of the delete list payload.
          schema:
            type: string
      requestBody:
        description: The container for the list of objects to delete and the
          quiet/verbose mode setting.
        required: true
        content:
          application/xml:
            schema:
              type: object
              description: The container for the list of objects to delete and the
                quiet/verbose mode setting.
      responses:
        "200":
          description: Successful response
          headers:
            x-amz-request-charged:
              description: Indicates if the request was charged under requester-pays billing
                rules.
              schema:
                type: string
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/DeleteObjectsOutput"
        "400":
          $ref: "#/components/responses/400Error"
        "403":
          $ref: "#/components/responses/403Error"
        "404":
          $ref: "#/components/responses/404Error"
    head:
      operationId: HeadBucket
      summary: HeadBucket
      description: >-
        Determines if a bucket exists and if the requester is authorized to
        access it.


        **Metadata Probe:** The operation returns an HTTP `200 OK` status code
        if the target bucket exists and the client credentials are authorized to
        perform the action. If the bucket does not exist or access is denied,
        the storage engine returns standard HTTP status codes (such as `404 Not
        Found` or `403 Forbidden`). Because this is a `HEAD` request, no
        response body is returned with error details.


        **Permissions:** Requesters must have permission to perform metadata
        checks or list the bucket. Under the standard S3 IAM policy model, this
        requires the `s3:ListBucket` action. The bucket owner has this
        permission by default.
      parameters:
        - name: Bucket
          in: path
          required: true
          description: The name of the bucket to check.
          schema:
            type: string
        - name: x-amz-expected-bucket-owner
          in: header
          required: false
          description: The account identifier of the expected bucket owner. If the actual
            owner does not match, the request fails with an HTTP `403 Forbidden`
            error.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          headers:
            x-amz-bucket-arn:
              description: The Amazon Resource Name (ARN) identifying the bucket, if returned
                by the storage engine.
              schema:
                type: string
            x-amz-bucket-location-type:
              description: The location type classification of the bucket (e.g., Regional).
              schema:
                type: string
            x-amz-bucket-location-name:
              description: The specific name of the location or zone where the bucket is
                deployed.
              schema:
                type: string
            x-amz-bucket-region:
              description: The location region of the bucket.
              schema:
                type: string
            x-amz-access-point-alias:
              description: Indicates whether the bucket name used in the request corresponds
                to an access point alias.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/400Error"
        "403":
          $ref: "#/components/responses/403Error"
        "404":
          $ref: "#/components/responses/404Error"
    get:
      operationId: ListMultipartUploadsOrListObjectsV2
      summary: ListMultipartUploadsOrListObjectsV2
      description: >-
        This endpoint combines multiple S3 behaviors depending on the request
        parameters and headers:


        ### ListMultipartUploads


        Lists in-progress multipart uploads in a bucket.


        **In-Progress Uploads:** An in-progress multipart upload is a session
        that has been initiated via `CreateMultipartUpload` but has not yet been
        completed (using `CompleteMultipartUpload`) or aborted (using
        `AbortMultipartUpload`).


        **Pagination and Sorting:** The operation returns up to 1,000 multipart
        uploads per response. If there are more uploads matching the criteria,
        the response returns `<IsTruncated>true</IsTruncated>` along with
        `<NextKeyMarker>` and `<NextUploadIdMarker>`. Clients must pass these
        values in subsequent requests as `key-marker` and `upload-id-marker`
        query parameters to paginate through the remaining results. Multipart
        uploads are sorted first by key in ascending order, and then by
        initiation time for uploads sharing the same key.


        **Permissions:** Requesters must have permission to list multipart
        uploads. Under the standard S3 IAM policy model, this requires the
        `s3:ListBucketMultipartUploads` action.


        ---


        ### ListObjectsV2


        Lists the objects within a bucket, returning up to 1,000 object keys per
        request.


        **Pagination and Filtering:** You can use query parameters to filter
        results by prefix, group keys using a delimiter, or paginate through
        large datasets using a continuation token. Objects are sorted in
        lexicographical order by their key name.


        **Permissions:** Requesters must have permission to list the contents of
        the bucket. Under the standard S3 IAM policy model, this requires the
        `s3:ListBucket` action.
      parameters:
        - name: Bucket
          in: path
          required: true
          description: The name of the bucket containing the in-progress multipart uploads
            to list.
          schema:
            type: string
        - name: delimiter
          in: query
          required: false
          description: A character used to group keys that share a common prefix. Using a
            delimiter groups keys containing that delimiter into
            `CommonPrefixes` results, returning only the unique common prefix
            rather than all matching uploads.
          schema:
            type: string
        - name: encoding-type
          in: query
          required: false
          description: Specifies the encoding method to use for object keys in the
            response (e.g. `url`). This is useful for handling keys that contain
            characters not supported by standard XML 1.0 parsers.
          schema:
            type: string
        - name: key-marker
          in: query
          required: false
          description: Specifies the object key after which listing should begin. This is
            used in conjunction with `upload-id-marker` to paginate results. If
            `upload-id-marker` is also specified, the listing includes uploads
            for keys equal to the marker if their upload IDs are
            lexicographically greater than the marker.
          schema:
            type: string
        - name: max-uploads
          in: query
          required: false
          description: Sets the maximum number of multipart uploads to return in the
            response body (between 1 and 1,000).
          schema:
            type: integer
        - name: prefix
          in: query
          required: false
          description: Restricts the returned uploads to those whose object keys begin
            with the specified prefix.
          schema:
            type: string
        - name: upload-id-marker
          in: query
          required: false
          description: Together with `key-marker`, specifies the multipart upload
            identifier after which listing should begin. If `key-marker` is not
            specified, this parameter is ignored. When both are specified, the
            listing includes uploads for keys equal to the `key-marker` only if
            their upload IDs are lexicographically greater than
            `upload-id-marker`.
          schema:
            type: string
        - name: x-amz-expected-bucket-owner
          in: header
          required: false
          description: The account identifier of the expected bucket owner. If the actual
            owner does not match, the request fails with an HTTP `403 Forbidden`
            error.
          schema:
            type: string
        - name: x-amz-request-payer
          in: header
          required: false
          description: Confirms that the requester understands they will be charged for
            processing the request. This header is required when accessing
            buckets configured with requester-pays billing enabled.
          schema:
            type: string
        - name: max-keys
          in: query
          required: false
          description: Sets the maximum number of keys returned in the response body
            (between 1 and 1,000).
          schema:
            type: integer
        - name: continuation-token
          in: query
          required: false
          description: A token returned by a previous truncated response, indicating that
            the listing should continue from where it left off. Clients must
            pass this value in subsequent requests to paginate through remaining
            results.
          schema:
            type: string
        - name: fetch-owner
          in: query
          required: false
          description: By default, owner information is omitted from the response to
            optimize performance. Setting this parameter to `true` forces the
            server to return owner metadata for each listed object.
          schema:
            type: boolean
        - name: start-after
          in: query
          required: false
          description: Specifies the object key after which listing should begin. This
            parameter can be any key in the bucket and is used to start the
            listing at a specific point without using a pagination token.
          schema:
            type: string
        - name: x-amz-optional-object-attributes
          in: header
          required: false
          description: A comma-separated list of optional object attributes to include in
            the response (such as `RestoreStatus`). Fields not explicitly
            requested are omitted.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          headers:
            x-amz-request-charged:
              description: Indicates if the request was charged under requester-pays billing
                rules.
              schema:
                type: string
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ListObjectsV2Output"
        "400":
          description: Successful response
          headers: {}
        "403":
          description: Successful response
          headers: {}
        "404":
          description: Successful response
          headers: {}
  /{Bucket}/{Key}:
    delete:
      operationId: AbortMultipartUploadOrDeleteObject
      summary: AbortMultipartUploadOrDeleteObject
      description: >-
        This endpoint combines multiple S3 behaviors depending on the request
        parameters and headers:


        ### AbortMultipartUpload


        Aborts a multipart upload operation, releasing all resources and storage
        space associated with the upload.


        **Upload Semantics:** Once aborted, no additional parts can be uploaded
        using the specified upload ID. The storage consumed by any previously
        uploaded parts is freed. If any part uploads are in progress when the
        abort request is processed, those uploads may or may not succeed. If a
        part upload succeeds after the abort, those resources might not be
        automatically cleaned up, so you should verify that the upload is fully
        aborted by checking that the part list is empty.


        **Permissions:** The client credentials must be authorized to perform
        this operation. Under the standard S3 IAM policy model, this requires
        the `s3:AbortMultipartUpload` action.


        ---


        ### DeleteObject


        Removes an object from a bucket.


        **Versioning Semantics:** The behavior of this operation depends on the
        bucket's versioning state:

        - **Versioning Disabled:** The object is permanently and immediately
        deleted.

        - **Versioning Enabled:** The storage engine creates a new, zero-byte
        "delete marker" and makes it the current version. The original version
        remains in the bucket's history. To permanently delete a specific
        version (or a delete marker), specify its version identifier in the
        `versionId` query parameter.

        - **Versioning Suspended:** The storage engine removes the object
        version that has a `null` version ID (if it exists) and inserts a delete
        marker as the current version.


        **Permissions:** Requesters must have permission to perform delete
        operations on the target bucket and object key path. Under the standard
        S3 IAM policy model, this requires the `s3:DeleteObject` action.
        Deleting a specific object version requires the `s3:DeleteObjectVersion`
        action.
      parameters:
        - name: Bucket
          in: path
          required: true
          description: The name of the bucket associated with the multipart upload to be
            aborted.
          schema:
            type: string
        - name: Key
          in: path
          required: true
          description: Key of the object for which the multipart upload was initiated.
          schema:
            type: string
        - name: uploadId
          in: query
          required: true
          description: Upload ID that identifies the multipart upload.
          schema:
            type: string
        - name: x-amz-request-payer
          in: header
          required: false
          description: Confirms that the requester understands they will be charged for
            processing the request. This header is typically required when
            accessing buckets configured with requester-pays billing enabled.
          schema:
            type: string
        - name: x-amz-expected-bucket-owner
          in: header
          required: false
          description: The account identifier of the expected bucket owner. If the actual
            owner does not match, the request fails with an HTTP `403 Forbidden`
            error.
          schema:
            type: string
        - name: x-amz-if-match-initiated-time
          in: header
          required: false
          description: >-
            > **Note:** Likely not portable. May be removed.


            If present, this header aborts an in-progress multipart upload only
            if it was initiated on the provided timestamp. If the initiated
            timestamp of the multipart upload does not match the provided value,
            the operation returns a `412 Precondition Failed` error.
          schema:
            type: string
        - name: x-amz-mfa
          in: header
          required: false
          description: "> **Avoid:** MFA delete configurations are legacy and unsupported
            by many engines."
          schema:
            type: string
        - name: versionId
          in: query
          required: false
          description: Specifies the version identifier of the object to permanently
            delete. If not specified, the delete operation applies to the
            current version.
          schema:
            type: string
        - name: x-amz-bypass-governance-retention
          in: header
          required: false
          description: Specifies whether to bypass Object Lock Governance-mode retention
            configurations to delete the object version.
          schema:
            type: boolean
        - name: If-Match
          in: header
          required: false
          description: Deletes the object only if its entity tag (ETag) matches the
            provided value. If the values do not match, the operation returns a
            `412 Precondition Failed` error.
          schema:
            type: string
        - name: x-amz-if-match-last-modified-time
          in: header
          required: false
          description: >-
            > **Note:** Likely not portable. May be removed.


            Deletes the object only if its last modified timestamp matches the
            specified value.
          schema:
            type: string
        - name: x-amz-if-match-size
          in: header
          required: false
          description: >-
            > **Note:** Likely not portable. May be removed.


            Deletes the object only if its size matches the specified value in
            bytes.
          schema:
            type: string
      responses:
        "204":
          description: Successful response
          headers:
            x-amz-request-charged:
              description: Indicates if the request was charged under requester-pays billing
                rules.
              schema:
                type: string
            x-amz-delete-marker:
              description: Indicates whether the deletion resulted in a new delete marker
                (true), or if the deleted version was itself a delete marker.
              schema:
                type: string
            x-amz-version-id:
              description: Returns the version identifier of the newly created delete marker,
                if applicable.
              schema:
                type: string
        "400":
          description: Successful response
          headers: {}
        "403":
          description: Successful response
          headers: {}
        "404":
          description: Successful response
          headers: {}
    post:
      operationId: CompleteMultipartUploadOrCreateMultipartUpload
      summary: CompleteMultipartUploadOrCreateMultipartUpload
      description: >-
        This endpoint combines multiple S3 behaviors depending on the request
        parameters and headers:


        ### CompleteMultipartUpload


        Completes a multipart upload by assembling previously uploaded parts
        into a single object.


        **Upload Assembling:** You first initiate the multipart upload and then
        upload all parts using the `UploadPart` or `UploadPartCopy` operations.
        After successfully uploading all parts, you call this operation to
        complete the upload. The storage engine concatenates all parts in
        ascending order by part number to create the final object. In the
        request body, you must provide a complete list of all parts, including
        the part number and the ETag returned by each individual upload.


        **Delayed Error Handling:** The completion process might take several
        minutes to finalize. The storage engine may return an initial HTTP `200
        OK` header to keep the connection alive while processing the assembly.
        White spaces may be sent periodically to prevent client timeouts.
        However, the assembly can still fail after this initial response is
        sent. Clients must parse the entire XML response body to verify that the
        assembly succeeded and did not contain an embedded error. Applications
        should be prepared to retry failed requests (including HTTP `500`
        internal errors).


        ---


        ### CreateMultipartUpload


        Initiates a multipart upload and returns an upload identifier
        (`UploadId`).


        **Multipart Workflow:** Initiating a multipart upload is the first step
        in uploading an object in multiple parts. The returned `UploadId` must
        be specified in all subsequent part uploads using `UploadPart` or
        `UploadPartCopy`. The upload session remains active until it is
        finalized using `CompleteMultipartUpload` or cancelled using
        `AbortMultipartUpload`. Storage charges may apply for accumulated parts
        until the upload is completed or aborted.


        **Storage Lifecycle:** If the target bucket has a lifecycle rule
        configured to abort incomplete multipart uploads, the session must be
        completed within the specified timeframe. Otherwise, the incomplete
        parts are automatically cleaned up by the storage engine to free up
        storage space.


        **Permissions:** Requesters must have permission to perform write
        operations on the target bucket and key path. Under the standard S3 IAM
        policy model, this requires the `s3:PutObject` action. Additional key
        permissions (such as `kms:GenerateDataKey`) may be required if
        encrypting the object using server-side encryption with KMS keys.
      parameters:
        - name: Bucket
          in: path
          required: true
          description: The name of the bucket to which the multipart upload was initiated.
          schema:
            type: string
        - name: Key
          in: path
          required: true
          description: The object key of the multipart upload to complete.
          schema:
            type: string
        - name: uploadId
          in: query
          required: true
          description: The unique identifier of the multipart upload to complete.
          schema:
            type: string
        - name: x-amz-checksum-crc32
          in: header
          required: false
          description: The Base64-encoded, 32-bit CRC32 checksum of the assembled object,
            used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-crc32c
          in: header
          required: false
          description: The Base64-encoded, 32-bit CRC32C checksum of the assembled object,
            used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-crc64nvme
          in: header
          required: false
          description: The Base64-encoded, 64-bit CRC64NVME checksum of the assembled
            object, representing the full-object checksum.
          schema:
            type: string
        - name: x-amz-checksum-sha1
          in: header
          required: false
          description: The Base64-encoded, 160-bit SHA1 digest of the assembled object,
            used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-sha256
          in: header
          required: false
          description: The Base64-encoded, 256-bit SHA256 digest of the assembled object,
            used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-sha512
          in: header
          required: false
          description: The Base64-encoded, 512-bit SHA512 digest of the assembled object,
            used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-md5
          in: header
          required: false
          description: The Base64-encoded, 128-bit MD5 digest of the assembled object,
            used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-xxhash64
          in: header
          required: false
          description: The Base64-encoded, 64-bit XXHASH64 checksum of the assembled
            object, used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-xxhash3
          in: header
          required: false
          description: The Base64-encoded, 64-bit XXHASH3 checksum of the assembled
            object, used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-xxhash128
          in: header
          required: false
          description: The Base64-encoded, 128-bit XXHASH128 checksum of the assembled
            object, used for data integrity verification.
          schema:
            type: string
        - name: x-amz-checksum-type
          in: header
          required: false
          description: Specifies how part-level checksums are combined to create the
            object-level checksum. If this does not match the checksum type
            specified during upload initiation, the request will fail with a
            `BadDigest` error.
          schema:
            type: string
        - name: x-amz-mp-object-size
          in: header
          required: false
          description: The expected total size of the final assembled object. If there is
            a mismatch between this value and the actual size of the assembled
            parts, an HTTP `400 Bad Request` error is returned.
          schema:
            type: string
        - name: x-amz-request-payer
          in: header
          required: false
          description: Confirms that the requester understands they will be charged for
            processing the request. This header is typically required when
            accessing buckets configured with requester-pays billing enabled.
          schema:
            type: string
        - name: x-amz-expected-bucket-owner
          in: header
          required: false
          description: The account identifier of the expected bucket owner. If the actual
            owner does not match, the request fails with an HTTP `403 Forbidden`
            error.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: >-
            Uploads the object only if the ETag value matches the ETag of the
            destination object. If the values do not match, the operation
            returns a `412 Precondition Failed` error.


            If a conflict occurs, the operation returns a `409
            ConditionalRequestConflict` response.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: >-
            Uploads the object only if the object key does not already exist in
            the bucket. Otherwise, the operation returns a `412 Precondition
            Failed` error.


            If a conflict occurs, the operation returns a `409
            ConditionalRequestConflict` response.
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-algorithm
          in: header
          required: false
          description: Specifies the encryption algorithm to use if the object was created
            using customer-provided encryption keys (SSE-C).
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-key
          in: header
          required: false
          description: Specifies the 256-bit, base64-encoded customer encryption key if
            using SSE-C.
          schema:
            type: string
        - name: x-amz-server-side-encryption-customer-key-MD5
          in: header
          required: false
          description: Specifies the 128-bit, base64-encoded MD5 digest of the customer
            encryption key if using SSE-C.
          schema:
            type: string
        - name: x-amz-acl
          in: header
          required: false
          description: >-
            The canned access control list (ACL) to apply to the object.


            > **Avoid:** Canned ACLs are legacy. Modern S3-compatible
            deployments typically disable ACLs in favor of bucket policies or
            IAM.
          schema:
            type: string
        - name: Cache-Control
          in: header
          required: false
          description: Specifies caching behavior along the request/reply chain.
          schema:
            type: string
        - name: Content-Disposition
          in: header
          required: false
          description: Specifies presentational information for the object.
          schema:
            type: string
        - name: Content-Encoding
          in: header
          required: false
          description: Specifies content encodings applied to the object, indicating what
            decoding mechanisms must be applied to obtain the media-type
            referenced by the Content-Type header.
          schema:
            type: string
        - name: Content-Language
          in: header
          required: false
          description: The language that the content is in.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: A standard MIME type describing the format of the object data.
          schema:
            type: string
        - name: Expires
          in: header
          required: false
          description: The date and time at which the object is no longer cacheable.
          schema:
            type: string
        - name: x-amz-grant-full-control
          in: header
          required: false
          description: >-
            Explicitly grants read, write, and ACL permissions to specified
            grantees.


            > **Avoid:** Fine-grained ACL grant headers are legacy. Modern
            S3-compatible deployments typically disable ACLs in favor of bucket
            policies or IAM.
          schema:
            type: string
        - name: x-amz-grant-read
          in: header
